version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: imenu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imenu
      POSTGRES_PASSWORD: imenu_dev_password
      POSTGRES_DB: imenu_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imenu -d imenu_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: imenu_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
